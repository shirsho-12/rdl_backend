[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/*.py" = ["D"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
branch = true
source = ["rdl_backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.github-actions]
python-versions = ["3.9"]

[tool.github-actions.steps]
- name: "Set up Python"
    uses: "actions/setup-python@v4"
    with:
        python-version: "${{ matrix.python-version }}"
- name: "Install dependencies"
    run: "pip install -r requirements.txt"
- name: "Run Ruff"
    run: "ruff ."
- name: "Run Tests"
    run: "pytest"
